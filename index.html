<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>GeoGuessr 言語マップ｜世界の文字と言語で国を当てる</title>
  <!-- Google Search Console の所有権確認用 -->
  <meta name="google-site-verification" content="59nymg4WYCvmxV9Vhm4dxex-ep4iYuux8kzzxZL3vD4">
  <meta name="description" content="GeoGuessr で国を当てるための学習マップ。看板の文字・言語・冠詞・宗教・ストリートビューのカバレッジを国ごとに地図と一覧で確認でき、手がかりから国を当てるクイズもあります。">

  <!-- 検索エンジン向け: 言語ごとの URL（?lang=ja / ?lang=en）。パラメータなしはブラウザの言語で表示 -->
  <link rel="alternate" hreflang="ja" href="https://toshtosh2024.github.io/geolearner/?lang=ja">
  <link rel="alternate" hreflang="en" href="https://toshtosh2024.github.io/geolearner/?lang=en">
  <link rel="alternate" hreflang="x-default" href="https://toshtosh2024.github.io/geolearner/">

  <!--
    SNS（X / Facebook / Discord / Slack など）でリンクを貼ったときのプレビュー。
    クローラーは JS を実行しないので、ここに直接書いた内容が使われる。
    画像は og-image.png（1200x630）。URL は絶対パスで書く必要がある
  -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="GeoGuessr 言語マップ">
  <meta property="og:url" content="https://toshtosh2024.github.io/geolearner/">
  <meta property="og:title" content="GeoGuessr 言語マップ｜世界の文字と言語で国を当てる">
  <meta property="og:description" content="看板の文字・言語・冠詞・宗教・ストリートビューのカバレッジを国ごとに確認できる GeoGuessr 学習マップ（日本語 / English）。">
  <meta property="og:locale" content="ja_JP">
  <meta property="og:locale:alternate" content="en_US">
  <meta property="og:image" content="https://toshtosh2024.github.io/geolearner/og-image.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="語族ごとに色分けした世界地図と「GeoGuessr 言語マップ」のタイトル">
  <!-- X 用。タイトル・説明・画像は上の og: を使う -->
  <meta name="twitter:card" content="summary_large_image">

  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌍</text></svg>">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- data-i18n* 属性の文言は、js/i18n.js の applyStaticText() で表示言語のものに差し替わる -->
  <div class="app">
    <header>
      <div class="brand">🌍 <span data-i18n="app.title">言語マップ</span><span class="brand-sub" data-i18n="app.subtitle">GeoGuessr 用・世界の文字と言語</span></div>
      <div class="seg" id="viewSeg">
        <button data-view="map" aria-pressed="true" data-i18n="view.map">地図</button>
        <button data-view="table" aria-pressed="false" data-i18n="view.table">一覧</button>
        <button data-view="quiz" aria-pressed="false" data-i18n="view.quiz">クイズ</button>
      </div>
      <div class="seg" id="modeSeg">
        <button data-mode="scr" aria-pressed="true" data-i18n="mode.scr">文字</button>
        <button data-mode="fam" aria-pressed="false" data-i18n="mode.fam">語族</button>
        <button data-mode="lingua" aria-pressed="false" data-i18n="mode.lingua">通用語</button>
        <button data-mode="rel" aria-pressed="false" data-i18n="mode.rel">宗教</button>
        <button data-mode="sv" aria-pressed="false" data-i18n="mode.sv">SV</button>
      </div>
      <div class="spacer"></div>
      <div class="search">
        <input id="q" type="text" placeholder="国名・言語で検索" data-i18n-placeholder="search.placeholder" autocomplete="off">
        <div class="sugg" id="sugg"></div>
      </div>
      <button class="iconbtn" id="labelBtn" title="国名ラベルの表示切替" data-i18n="btn.labels" data-i18n-title="btn.labelsTitle">🏷 ラベル</button>
      <button class="iconbtn" id="themeBtn" title="ライト / ダーク" data-i18n-title="btn.themeTitle">◐</button>
      <div class="seg" id="langSeg" title="表示言語" data-i18n-title="btn.langTitle">
        <button data-lang="ja" aria-pressed="true">JA</button>
        <button data-lang="en" aria-pressed="false">EN</button>
      </div>
    </header>

    <main>
      <div class="stage" id="stage">
        <canvas id="map"></canvas>
        <!-- 詳細地図（MapLibre）。「詳細」を選んだときに js/detail-map.js が作る -->
        <div class="detail-map hidden" id="detailMap"></div>
        <div class="zoombar">
          <button id="zin">＋</button>
          <button id="zout">−</button>
          <button id="zreset" title="全体表示" data-i18n-title="zoom.resetTitle">⤢</button>
        </div>
        <div class="legend" id="legend"></div>
        <div class="tip" id="tip"></div>
        <div class="quizbar hidden" id="quizbar"></div>
        <div class="seg basemap-seg" id="baseSeg" title="地図の種類" data-i18n-title="base.title">
          <button data-base="simple" aria-pressed="true" data-i18n="base.simple">シンプル</button>
          <button data-base="detail" aria-pressed="false" data-i18n="base.detail">詳細</button>
        </div>
      </div>
      <div class="tablewrap hidden" id="tablewrap"></div>
      <aside id="side"></aside>
      <div class="resizer" id="sideResizer" role="separator" tabindex="0" title="ドラッグでサイズ調整（ダブルクリックで元に戻す）" data-i18n-title="side.resizeTitle"></div>
    </main>
  </div>

  <!--
    スクリプトはすべて通常の <script> で、トップレベルの const / let / function を共有している。
    上のファイルで定義したものを下のファイルが使うので、読み込み順は変えないこと。
  -->

  <!-- データ（*.en.js は英語版。日本語版と同じキーで表示テキストだけを持つ） -->
  <script src="js/data/world-topo.js"></script>
  <script src="js/data/countries.js"></script>
  <script src="js/data/countries.en.js"></script>
  <script src="js/data/grammar.js"></script>
  <script src="js/data/grammar.en.js"></script>
  <script src="js/data/religion.js"></script>
  <script src="js/data/religion.en.js"></script>
  <script src="js/data/ui-text.js"></script>

  <!-- アプリ本体 -->
  <script src="js/i18n.js"></script>        <!-- 表示言語・文言・データの言語別ビュー -->
  <script src="js/modes.js"></script>       <!-- カテゴリ定義 -->
  <script src="js/geometry.js"></script>    <!-- TopoJSON → 地図パス -->
  <script src="js/map.js"></script>         <!-- 状態・描画・当たり判定 -->
  <script src="js/interaction.js"></script> <!-- ドラッグ・ズーム -->
  <script src="js/sidebar.js"></script>     <!-- サイドバー -->
  <script src="js/resizer.js"></script>     <!-- サイドバーの幅調整 -->
  <script src="js/legend.js"></script>      <!-- 凡例 -->
  <script src="js/table.js"></script>       <!-- 一覧タブ -->
  <script src="js/quiz.js"></script>        <!-- クイズ -->
  <script src="js/detail-map.js"></script>  <!-- 詳細地図（MapLibre ＋ OpenFreeMap） -->
  <script src="js/main.js"></script>        <!-- ビュー切替・検索・テーマ・表示言語・起動 -->
</body>
</html>
